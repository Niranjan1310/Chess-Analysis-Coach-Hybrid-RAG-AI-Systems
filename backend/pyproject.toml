[project]
name = "chess-analysis-coach"
version = "0.1.0"
description = "Chess Analysis Coach – find mistakes with Stockfish and get AI explanations"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "python-chess>=1.10.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sentence-transformers>=2.2.0",
    "chromadb>=0.4.0",
    "rank-bm25>=0.2.2",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = [".", ".."]
testpaths = ["tests"]
